name: Build and Publish

on: [push, pull_request]

env:
  PLUTOBOOK_VERSION: 0.20.0
jobs:
  build_sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Build sdist
        run: |
          python -m pip install -U pip build
          python -m build --sdist -Csetup-args=-Dsdist=true

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: ./dist/*.tar.gz

  build_linux_wheels:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || contains(github.event.head_commit.message, '[build:wheels]')
    steps:
      - uses: actions/checkout@v6
      - name: Copy fontconfig files
        run: |
          cp -rv /etc/fonts/* fontconfig

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.1
        env:
          CIBW_BUILD: |
            cp313-manylinux_x86_64
          CIBW_BEFORE_BUILD: dnf update && dnf install -y brotli brotli-devel
          CIBW_MANYLINUX_X86_64_IMAGE: ghcr.io/plutoprint/plutobook-manylinux_2_28_x86_64:v${{ env.PLUTOBOOK_VERSION }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >
            python -c "import plutoprint; print(plutoprint.__build_info__)" &&
            python -m pytest -v {project}/tests

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-linux-wheels
          path: ./wheelhouse/*.whl

